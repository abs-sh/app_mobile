name: Build Android APK

on:
  push:
    branches: [ "main" ] # هر وقت کدی به شاخه اصلی فرستادید، شروع به کار کن

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flet

    - name: Build APK
      run: |
        # دستور بیلد فلت برای اندروید
        flet build apk

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: my-app-apk
        path: build/apk/*.apk # مسیر فایل خروجی را مشخص می‌کند
